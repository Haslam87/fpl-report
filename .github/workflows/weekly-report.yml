name: FPL Weekly Report

on:
  workflow_dispatch:
    inputs:
      gw:
        description: "Gameweek to report on (optional, defaults to auto-detect)"
        required: false
        type: string
      report:
        description: "Which report to run"
        required: false
        type: choice
        default: weekly
        options:
          - weekly
          - season-review
      preview:
        description: "Preview only — print to the log, don't post to Slack or update the snapshot"
        required: false
        type: boolean
        default: false
  schedule:
    # Tuesday ~09:07 UTC — after Monday night fixtures and bonus-point
    # confirmation. GitHub cron runs in UTC (drifts against BST during the
    # season, so this lands ~10:07 local during BST). Off-the-hour minute
    # deliberately avoids GitHub's documented top-of-the-hour scheduler
    # congestion; scheduled runs can still be delayed under load, so treat
    # this as "roughly Tuesday morning", not exact.
    - cron: "7 9 * * 2"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run report
        env:
          FPL_LEAGUE_ID: ${{ secrets.FPL_LEAGUE_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GW_INPUT: ${{ inputs.gw }}
          REPORT: ${{ inputs.report }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          args=()
          if [ "$PREVIEW" = "true" ]; then args+=(--dry-run); else args+=(--post); fi
          if [ "$REPORT" = "season-review" ]; then args+=(--season-review); fi
          if [ -n "$GW_INPUT" ]; then args+=("--gw=$GW_INPUT"); fi
          node fpl-report.js "${args[@]}"

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last-standings.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update standings snapshot [skip ci]"
            git push
          else
            echo "No snapshot changes to commit."
          fi
