name: FPL Weekly Report

on:
  workflow_dispatch:
    inputs:
      gw:
        description: "Gameweek to report on (optional, defaults to auto-detect)"
        required: false
        type: string
      force:
        description: "Post even if this gameweek was already reported"
        required: false
        type: boolean
        default: false
  schedule:
    # Tuesday early morning (05:07 UTC), with a second attempt at 09:07 UTC —
    # after Monday night fixtures and bonus-point confirmation. GitHub cron
    # runs in UTC (so ~06:07/10:07 local during BST). Scheduled runs are often
    # delayed by hours under load (observed: 09:07 starting mid-afternoon), so
    # the early slot is there to land in the morning despite that lag. Off-the-
    # hour minutes deliberately avoid GitHub's top-of-the-hour congestion.
    #
    # Also retried Wednesday and Thursday (09:07 UTC): if Monday night football
    # (or slow bonus confirmation) means the gameweek isn't settled yet, a
    # later run picks it up. Once a gameweek is reported, later runs skip it,
    # so the extra runs are no-ops in a normal week.
    - cron: "7 5,9 * * 2"
    - cron: "7 9 * * 3,4"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run report
        env:
          FPL_LEAGUE_ID: ${{ secrets.FPL_LEAGUE_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GW_INPUT: ${{ inputs.gw }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(--post)
          if [ -n "$GW_INPUT" ]; then args+=("--gw=$GW_INPUT"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          node fpl-report.js "${args[@]}"

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last-standings.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update standings snapshot [skip ci]"
            git push
          else
            echo "No snapshot changes to commit."
          fi
