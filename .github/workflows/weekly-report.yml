name: FPL Weekly Report

on:
  workflow_dispatch:
    inputs:
      gw:
        description: "Gameweek to report on (optional, defaults to auto-detect)"
        required: false
        type: string
  schedule:
    # Tuesday 09:00 UTC — after Monday night fixtures and bonus-point
    # confirmation. GitHub cron runs in UTC (drifts against BST during the
    # season) and scheduled runs can be delayed under GitHub Actions load,
    # so treat this as "roughly Tuesday morning", not exact.
    - cron: "0 9 * * 2"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run report
        env:
          FPL_LEAGUE_ID: ${{ secrets.FPL_LEAGUE_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "${{ inputs.gw }}" ]; then
            node fpl-report.js --post --gw=${{ inputs.gw }}
          else
            node fpl-report.js --post
          fi

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last-standings.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update standings snapshot [skip ci]"
            git push
          else
            echo "No snapshot changes to commit."
          fi
